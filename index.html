<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07111f">
  <meta name="description" content="Artiman AI — برنامه‌ریزی، پیشرفت، گیتار، مطالعه، باشگاه و TikTok">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <title>Artiman AI</title>
</head>
<body>
  <div class="aurora aurora-a"></div>
  <div class="aurora aurora-b"></div>

  <header class="topbar glass">
    <div class="brand">
      <div class="brand-icon">A</div>
      <div>
        <div class="brand-name">Artiman AI</div>
        <div class="brand-sub" data-i18n="brandSub">داشبورد شخصی تو</div>
      </div>
    </div>
    <div class="top-actions">
      <button class="icon-btn" id="langBtn" aria-label="Language">EN</button>
      <button class="icon-btn" id="themeBtn" aria-label="Theme">☾</button>
    </div>
  </header>

  <main class="app-shell">
    <section id="screen-home" class="screen active"></section>
    <section id="screen-plan" class="screen"></section>
    <section id="screen-ai" class="screen"></section>
    <section id="screen-progress" class="screen"></section>
    <section id="screen-settings" class="screen"></section>
  </main>

  <nav class="bottom-nav glass" aria-label="Main navigation">
    <button class="nav-btn active" data-screen="home"><span>⌂</span><small data-i18n="navHome">خانه</small></button>
    <button class="nav-btn" data-screen="plan"><span>▦</span><small data-i18n="navPlan">برنامه</small></button>
    <button class="nav-btn" data-screen="ai"><span>✦</span><small data-i18n="navAI">دستیار AI</small></button>
    <button class="nav-btn" data-screen="progress"><span>◔</span><small data-i18n="navProgress">پیشرفت</small></button>
    <button class="nav-btn" data-screen="settings"><span>⚙</span><small data-i18n="navSettings">تنظیمات</small></button>
  </nav>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
